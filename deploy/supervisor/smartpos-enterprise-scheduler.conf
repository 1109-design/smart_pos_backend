; SmartPOS scheduler (production) — Enterprise deployment
; (/var/www/SmartPosEnterprise/smart_pos_backend). Runs routes/console.php:
; ZIMRA pings (5 min), nightly fiscal day close (23:45 Harare), close
; confirmation, retries, health alerts and certificate renewal. If this is
; down, devices stop pinging and fiscal days are never closed, so alert on it.
; Install: sudo cp smartpos-enterprise-scheduler.conf /etc/supervisor/conf.d/ &&
;          sudo supervisorctl reread && sudo supervisorctl update
[program:smartpos-enterprise-scheduler]
command=php /var/www/SmartPosEnterprise/smart_pos_backend/artisan schedule:work
directory=/var/www/SmartPosEnterprise/smart_pos_backend
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/smartpos/enterprise-scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=APP_ENV="production"
