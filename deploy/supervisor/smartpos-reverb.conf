; SmartPOS Reverb WebSocket server (production).
; Install: sudo cp smartpos-reverb.conf /etc/supervisor/conf.d/ &&
;          sudo supervisorctl reread && sudo supervisorctl update
; Requires REVERB_APP_ID/KEY/SECRET + REVERB_HOST/PORT/SCHEME in the
; backend .env. Tills connect here for sync.tables_changed fan-out;
; if this process is down the apps degrade to 10s poll sync (by design),
; so alert on it, don't page as a full outage.
[program:smartpos-reverb]
process_name=%(program_name)s
command=php /var/www/smartpos-backend/artisan reverb:start --host=0.0.0.0 --port=8080
directory=/var/www/smartpos-backend
autostart=true
autorestart=true
startretries=10
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/smartpos/reverb.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=APP_ENV="production"
