; SmartPOS Reverb WebSocket server (production) — Enterprise deployment only.
; The Legacy "Smart POS" deployment (/var/www/smart_pos_backend) does not run
; Reverb (BROADCAST_CONNECTION=log there), so it has no counterpart conf.
; Install: sudo cp smartpos-enterprise-reverb.conf /etc/supervisor/conf.d/ &&
;          sudo supervisorctl reread && sudo supervisorctl update
; Requires REVERB_APP_ID/KEY/SECRET + REVERB_HOST/PORT/SCHEME in the
; backend .env. Binds to 127.0.0.1:8090 only (not exposed directly — ports
; 8080-8083 on this host are already taken by other nginx-served apps);
; nginx proxies wss://smartpospro.chaitechsolutions.online/app + /apps to
; this port (see /etc/nginx/sites-available/smartpospro). Tills connect
; through that public endpoint for sync.tables_changed fan-out; if this
; process is down the apps degrade to 10s poll sync (by design), so alert
; on it, don't page as a full outage.
[program:smartpos-enterprise-reverb]
process_name=%(program_name)s
command=php /var/www/SmartPosEnterprise/smart_pos_backend/artisan reverb:start --host=127.0.0.1 --port=8090
directory=/var/www/SmartPosEnterprise/smart_pos_backend
autostart=true
autorestart=true
startretries=10
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/smartpos/enterprise-reverb.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=APP_ENV="production"
