; SmartPOS queue workers (production) — Legacy "Smart POS" deployment
; (/var/www/smart_pos_backend). This is a separate codebase/host path from the
; Enterprise deployment (see smartpos-enterprise-queue.conf); program names and
; log files are kept distinct so both can be installed side-by-side on the
; same host. No Reverb counterpart: this deployment uses BROADCAST_CONNECTION=log.
; Install: sudo cp smartpos-legacy-queue.conf /etc/supervisor/conf.d/ &&
;          sudo supervisorctl reread && sudo supervisorctl update
[program:smartpos-legacy-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/smart_pos_backend/artisan queue:work database --sleep=1 --tries=3 --max-time=3600
directory=/var/www/smart_pos_backend
autostart=true
autorestart=true
numprocs=2
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/smartpos/legacy-queue.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=APP_ENV="production"
