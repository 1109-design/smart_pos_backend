; SmartPOS queue workers (production). Broadcasts (sync.tables_changed and
; the domain events) ride the default queue, so these daemons ARE the
; realtime path — if they stall, sockets stay silent and tills fall back
; to polling. Monitor `failed_jobs` (any row = investigate) and queue
; depth (`jobs` table count sustained > 50 = scale numprocs).
; This is the Enterprise deployment (/var/www/SmartPosEnterprise/smart_pos_backend).
; The Legacy "Smart POS" deployment (/var/www/smart_pos_backend) runs its own
; smartpos-legacy-queue.conf — program names and log files are kept distinct so
; both can be installed side-by-side on the same host.
; Install: sudo cp smartpos-enterprise-queue.conf /etc/supervisor/conf.d/ &&
;          sudo supervisorctl reread && sudo supervisorctl update
[program:smartpos-enterprise-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/SmartPosEnterprise/smart_pos_backend/artisan queue:work database --sleep=1 --tries=3 --max-time=3600
directory=/var/www/SmartPosEnterprise/smart_pos_backend
autostart=true
autorestart=true
numprocs=2
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/smartpos/enterprise-queue.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=APP_ENV="production"
